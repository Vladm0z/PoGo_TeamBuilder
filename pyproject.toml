[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pvp-team-builder"
version = "1.1.0"
description = "Search Pokemon GO PvP teams with PvPoke's own battle engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pvp-team-builder contributors" }]
keywords = ["pokemon-go", "pvp", "gbl", "pvpoke", "team-builder"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
pvp-team-builder = "pvp_team_builder.cli:main"

[project.urls]
Homepage = "https://github.com/USER/pvp-team-builder"
Issues = "https://github.com/USER/pvp-team-builder/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pvp_team_builder = ["cpm.json", "harness.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
# `ruff format` also rewrites Python snippets inside Markdown; those are documentation
# samples with hand-aligned comments, so leave Markdown and the generated reports alone.
extend-exclude = ["examples", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
# W291/W293 (trailing whitespace) are in the rule set above, so `ruff check` catches
# them; `ruff format` does not remove them outside code lines.

[tool.ruff.format]
line-ending = "lf"

