name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest

      - name: Engine exactness (simulates PvPoke's published ratings)
        run: pvp-team-builder validate -l great -l ultra --n 25

      - name: CLI smoke test
        run: |
          pvp-team-builder teambuild -l great --mons "Azumarill, Skarmory, Clodsire, Talonflame" --top 2
          pvp-team-builder rate -l great --mons "Azumarill, Skarmory, Clodsire" > /dev/null
          pvp-team-builder info -l great --mons "Raichu (Alolan)" > /dev/null
