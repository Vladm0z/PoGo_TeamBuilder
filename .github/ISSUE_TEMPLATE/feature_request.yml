name: Feature request
description: Suggest a capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do and where the tool got in the way. Concrete examples are more useful than abstractions.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Does it fit the stated scope?
      description: |
        In scope: 3v3 Great, Ultra and Master League and cups, scoring fidelity
        with PvPoke, data handling. Out of scope by design: ABB and BAB planning,
        3v3 simulation, IV optimisation, account management. See CONTRIBUTING.md.
